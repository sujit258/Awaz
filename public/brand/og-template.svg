<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="og-bg-glow" cx="600" cy="200" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="og-icon-bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="og-text-grad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="teal-accent-og" x1="60" y1="20" x2="70" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#087E8B"/>
    </linearGradient>
  </defs>

  <!-- Dark Rich Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#og-bg-glow)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Top Brand Lockup -->
  <g transform="translate(100, 80)">
    <!-- 80x80 Icon -->
    <rect width="80" height="80" rx="20" fill="url(#og-icon-bg)"/>
    <rect x="1" y="1" width="78" height="78" rx="19" stroke="white" stroke-opacity="0.2" stroke-width="2"/>
    
    <!-- Soundwave & Evidence Bars -->
    <rect x="18" y="34" width="7" height="20" rx="3.5" fill="#93C5FD"/>
    <rect x="29" y="24" width="7" height="34" rx="3.5" fill="#FFFFFF"/>
    <rect x="40" y="17" width="7" height="43" rx="3.5" fill="#FFFFFF"/>
    <rect x="51" y="28" width="7" height="28" rx="3.5" fill="url(#teal-accent-og)"/>
    <circle cx="54.5" cy="18" r="3.5" fill="#2DD4BF"/>

    <!-- Wordmark & Tagline -->
    <text x="104" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="#FFFFFF">
      Awaz
    </text>
    <text x="106" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#2DD4BF">
      PUBLIC CONSUMER EVIDENCE
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 260)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      One issue. Many voices.
    </text>
    <text x="0" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="url(#og-text-grad)" letter-spacing="-1">
      Visible evidence.
    </text>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8" width="900">
      Independent public-interest platform turning isolated consumer delivery issues
    </text>
    <text x="0" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
      into credible, aggregated evidence and collective accountability.
    </text>
  </g>

  <!-- Bottom Badges / URL -->
  <g transform="translate(100, 520)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
    <text x="90" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">
      Independent Tracker
    </text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="170" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
    <text x="280" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">
      Privacy by Default
    </text>

    <!-- Pill 3 -->
    <rect x="380" y="0" width="185" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
    <text x="472.5" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">
      Verifiable Evidence
    </text>

    <!-- Domain -->
    <text x="1000" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#38BDF8" text-anchor="end">
      awaz.suvidhatools.in
    </text>
  </g>
</svg>
