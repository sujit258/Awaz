<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="awaz-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="teal-accent" x1="40" y1="12" x2="45" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#087E8B"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#awaz-bg)"/>
  
  <!-- Subtle inner border for contrast -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Resonant Voice & Evidence Soundwave Bars -->
  <!-- 1. First Voice (Voluntary citizen report) -->
  <rect x="15" y="27" width="5.5" height="15" rx="2.75" fill="#93C5FD"/>

  <!-- 2. Community Echo (Shared complaint patterns) -->
  <rect x="23.5" y="19" width="5.5" height="27" rx="2.75" fill="#FFFFFF"/>

  <!-- 3. Collective Evidence Peak (Aggregated data) -->
  <rect x="32" y="14" width="5.5" height="34" rx="2.75" fill="#FFFFFF"/>

  <!-- 4. Resolution & Accountability (Teal outcome) -->
  <rect x="40.5" y="22" width="5.5" height="22" rx="2.75" fill="url(#teal-accent)"/>

  <!-- Verification Anchor Dot -->
  <circle cx="43.25" cy="14" r="2.75" fill="#2DD4BF"/>
</svg>
